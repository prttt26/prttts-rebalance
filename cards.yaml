  - name_zh: 以手拒之
    pool: colorless
    rarity: uncommon
    op: add
    origin: sts1_watcher
    cost: 1
    type: attack
    keywords: [消耗]
    effect: 造成5点伤害；此后每当【你】用攻击牌攻击该敌人时，【你】获得2点格挡
    upgrade: 7点伤害，3点格挡
    impl_note: >
      格挡收益方是玩家，不是被标记的敌人（塔1原文 "Whenever you attack this enemy,
      gain 2 Block"）。原表述「这个敌人每次被攻击时获得2格挡」主语有歧义，
      按字面读会实现成给敌人加甲，那这张就成了纯负面卡。
      多段攻击逐段触发；非攻击牌伤害（中毒/灼烧）不触发。

  - name_zh: 疯狂
    pool: colorless
    rarity: uncommon
    op: add
    origin: sts1_colorless_uncommon
    cost: 1
    type: skill
    keywords: [消耗]
    effect: 使手牌中一张随机卡本场战斗免费（免费＝费用与辉星消耗均为0）
    upgrade: 费用降为0
    selection_rules:
      排除: |
        - 不可打出的卡（免费了也打不出来）
        - X 费卡（吃的是当前全部能量，「变0费」对它无效）
        - 本来就是 0 费 0 辉星的卡（没有收益可拿）
      优先级: |
        1. 此刻真的还要花费的卡
        2. 「临时0费」的卡——转成永久0费仍有价值，但不如省下一张全价卡，故后置（同塔1取舍）
      无候选时: 照常打出并消耗，无事发生
    impl_note: >
      「是否已经免费」用现成的 `CardModel.CostsEnergyOrStars(includeGlobalModifiers: true)`,
      其 XML 注释明确写了就是给这类效果用的；且它内部 `!EnergyCost.CostsX` 分支
      使 X 费卡也返回 false，一次调用同时覆盖「已免费」与「X 费」两个排除条件。
      区分「临时0费 vs 本来就0费」要看**永久基础值**：`EnergyCost.Canonical` 与
      `BaseStarCost`（后者默认 -1 表示无辉星消耗，故用 > 0 判断）。

