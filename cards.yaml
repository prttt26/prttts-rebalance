cards:

  # ═══════════════════════════════════════════════════════
  # 1. 无色卡（colorless）
  # ═══════════════════════════════════════════════════════

  - name_zh: 天人形态
    pool: colorless
    rarity: rare
    op: add
    origin: sts1_watcher
    cost: 3
    type: power
    keywords: [虚无]
    effect: >
      【你】的每个回合结束时，获得「每回合开始时获得1费」。
      是递增不是恒定+1：每回合能量依次为 3（打出当回合，不加费）→ 4 → 5 → 6 …
    upgrade: 去除虚无
    impl_note: >
      双能力实现：DevaFormPower（引擎）在回合结束时叠 1 层基础游戏的 PyrePower
      （薪火之源的能力，ModifyMaxEnergy 永续加费），与狂暴/薪火之源共用同一个计数器。
      「回合结束时获得…」单看容易读成恒定+1，所以 effect 里必须带着序列写。
      ⚠️ 打出时**不要**再预给一层 PyrePower：回合结束叠层 + 预给层会变成 3 → 5 → 6，快一拍。
      **不是** EnergyNextTurnPower（那个是一次性的）。

  - name_zh: 双重存在
    pool: colorless
    rarity: rare
    op: add
    origin: sts1_silent
    cost: X
    type: skill
    keywords: [消耗]
    effect: 下回合获得X费，抽X张
    upgrade: X+1（费与抽牌均+1）

  - name_zh: 操控现实
    pool: colorless
    rarity: rare
    op: add
    origin: sts1_watcher
    cost: 1
    type: power
    effect: 战斗中所有产生的卡升级
    upgrade: 费用降为0

  - name_zh: 自我修复
    pool: colorless
    rarity: rare
    op: add
    origin: sts1_defect
    cost: 1
    type: power
    keywords: [恢复性]
    effect: 战斗结束时，你回复9点生命（逃跑也触发；仅战败/死亡不触发）
    upgrade: 12点生命
    note: 相对塔1数值增强
    impl_note: >
      「恢复性」不是 CardKeyword（枚举里没有），而是 CardModel 的虚属性
      `public override bool CanBeGeneratedInCombat => false;`——
      CardFactory.FilterForCombat 会按它过滤，于是结茧/羽化/磁力/发现 等
      战斗内生成效果都不会产出此卡。卡牌奖励、商店、转化不受影响。
      回血挂 AfterCombatEnd + `if (Owner.IsDead) return;`，**不是** AfterCombatVictory——
      后者只在打赢时触发，会把逃跑一起漏掉；设计要求逃跑照给，只有战败不给。

