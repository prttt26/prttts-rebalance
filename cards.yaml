# 塔2 Mod 卡牌数据（结构化）
#
# 本文件是「是什么」的载体：可直接对照写 C# 卡类。
# 「为什么」（设计理由、价值论推导）仍在《杀戮尖塔2 Mod 制作计划.md》，两者不重复。
#
# 数据全部转录自该设计文档（2026-07-17 版本），未做任何数值改动。
# 如与设计文档冲突，以设计文档为准并回来修正本文件。

meta:
  source: 杀戮尖塔2 Mod 制作计划.md
  transcribed: 2026-07-17

# ── schema 说明 ──────────────────────────────────────────────
# op:      add    新卡进池（塔1回归 / 新设计）
#          remove 基础游戏卡移出卡池
#          modify 改基础游戏卡的数值/效果
#          move   卡在稀有度/角色间移动（实现上 = remove + add，故单列）
#          pin    版本锁定：现在不改，但记下当前官方版本；官方之后改了这张卡，本 mod 要回滚到这里记的版本
# rarity:  common(普通) / uncommon(罕见) / rare(稀有) / ancient(先古)
# pool:    colorless / ironclad / silent / defect / necrobinder(亡灵契约师)
#          / prince(储君) / special
# cost:    数字或 "X"；升级后变化记在 upgrade
# type:    attack / skill / power
#
# ⚠️ 词条的两个字段，务必区分（设计文档约定：括号 = 升级效果）：
#   keywords          基础词条，卡未升级时就有。文档中【不带括号】，如「触不可及：奇巧，...」
#   upgrade_keywords  升级后【获得】的词条。文档中【带括号】，如「核心电泳：（固有）」
#   升级后【去除】词条（如「虚无（不虚无）」）写成 keywords: [虚无] + upgrade: 去除虚无
# 混淆 keywords 与 upgrade_keywords 会让卡在未升级时就带上不该有的词条。
# status:  confirmed(默认，不写) / undecided(待定) / options(有多个备选方案)
#          / shelved(暂时放弃 或 备用选项：保留设计记录，但未启用、不在卡池里，统计卡数时不计)
# impl_note: 实现时踩过的坑 / 容易读错的地方。写给下一个照着实现的人看。
#
# ⚠️ effect 写法铁律：**主语和受益方必须写出来，不许靠上下文猜**。
#   实机踩过的例子：「这个敌人每次被攻击时获得2格挡」——「获得」的主语是谁？
#   按字面读成敌人加甲，实现出来是一张纯负面卡；塔1原意是玩家获得格挡。
#   同类还有「获得2层易伤」（给自己还是给敌人）。
#   拿不准就用【】把主语框出来，如「此后每当【你】攻击该敌人时，【你】获得2点格挡」。
#
# ⚠️ 数值随回合变化的，必须写清是**恒定**还是**递增**，并给出前几回合的实际序列。
#   「回合结束时获得"回合开始时获得1费"」读起来像恒定+1，实际设计是递增。
# ────────────────────────────────────────────────────────────

# 通用词条（供实现时查阅，非卡牌）
keywords_glossary:
  固有: 战斗开始时出现在手牌中，占用第一回合抽牌
  虚无: 回合结束时如果在手牌中，消耗
  消耗: 打出后进入消耗堆（而不是弃牌堆）
  奇巧: 猎人专属机制，从手牌中被丢弃时打出
  保留: 回合结束时留在手牌中而不是进入弃牌堆
  恢复性: >
    战斗中随机产生卡牌效果不会产生，防止故意延长战斗过于有利。
    实现：override `CanBeGeneratedInCombat => false`（CardModel 的虚属性，**不是** CardKeyword，
    枚举里没有这一项）。CardFactory.FilterForCombat 按它过滤；卡牌奖励/商店/转化不受影响。
  免费: 费用和辉星消耗均变为0，对X费无效（为储君的辉星消耗重新适配的「变为0费」）

