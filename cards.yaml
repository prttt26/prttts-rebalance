  - name_zh: 狂暴
    pool: colorless
    rarity: uncommon
    op: add
    origin: sts1_ironclad
    cost: 0
    type: power
    effect: 你自己获得2层易伤；此后你每回合开始时获得的能量永久+1（恒定，不递增）
    upgrade: 改为你自己只获得1层易伤（代价变小）
    impl_note: >
      易伤是施加给自己的代价，不是给敌人的。加费与天人形态同为永续，
      故同样用 ModifyMaxEnergy 而非 PlayerCmd.GainEnergy——
